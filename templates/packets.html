<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recent Packets - MeshCore Dashboard</title>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
  <style>
    .packets-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 0 1.25rem;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 1.5rem;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    .back-btn {
      background: none;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-family: inherit;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover { color: #38bdf8; border-color: #38bdf8; }
    .packets-title { font-size: 1.3rem; font-weight: 700; color: #38bdf8; }
    .packets-subtitle { font-size: 0.8rem; color: #64748b; margin-left: auto; }

    .packets-body {
      max-width: 1200px;
      margin: 0 auto;
    }
    .packets-toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    /* filter-pill removed — filter hamburger menu lives in style.css */

    .pkt-search {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 0.78rem;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-family: inherit;
      width: 140px;
      outline: none;
      transition: border-color 0.2s;
    }
    .pkt-search:focus { border-color: #38bdf8; }
    .pkt-search::placeholder { color: #475569; }

    .time-select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 20px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    .time-select:focus { border-color: #38bdf8; }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      color: #22c55e;
      margin-left: auto;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .paused-badge { color: #64748b; }
    .paused-badge .live-dot { background: #64748b; animation: none; }

    .packets-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .packets-toolbar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      flex-wrap: nowrap;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .packets-toolbar::-webkit-scrollbar { display: none; }
    .packets-toolbar .filter-pill,
    .packets-toolbar .pkt-search,
    .packets-toolbar .time-select,
    .packets-toolbar .raw-toggle-btn,
    .packets-toolbar .live-badge { flex-shrink: 0; }

    .packet-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.82rem;
      transition: border-color 0.2s;
    }
    .packet-row:hover { border-color: #334155; }
    .packet-row.new-flash { animation: row-flash 0.6s ease-out; }
    @keyframes row-flash {
      0% { background: #1e293b; }
      100% { background: #0f172a; }
    }

    /* Top row: badge left, time right */
    .pkt-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .pkt-time {
      color: #475569;
      font-size: 0.7rem;
      white-space: nowrap;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
    .pkt-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge-contact_msg  { background: #1e3a5f; color: #60a5fa; }
    .badge-channel_msg  { background: #1c3a2e; color: #4ade80; }
    .badge-ack          { background: #1e2d1e; color: #86efac; }
    .badge-path         { background: #2d1e3a; color: #c084fc; }
    .badge-rx           { background: #1e2a3a; color: #94a3b8; }
    .badge-rx-request   { background: #1a2a1a; color: #86efac; }
    .badge-rx-advert    { background: #2a1e1e; color: #f97316; }
    .badge-rx-grouptext { background: #1c3a2e; color: #4ade80; }
    .badge-rx-response  { background: #1e2a3a; color: #7dd3fc; }
    .badge-rx-path      { background: #2d1e3a; color: #c084fc; }
    .badge-rx-anon      { background: #2a1a2a; color: #f472b6; }
    .badge-rx-textmsg   { background: #1e3a5f; color: #93c5fd; }
    .badge-advert_sent  { background: #1a2a1a; color: #4ade80; }

    .pkt-body { color: #cbd5e1; line-height: 1.45; }
    .pkt-meta { font-size: 0.72rem; color: #64748b; margin-top: 0.2rem; }
    .pkt-text { color: #e2e8f0; }

    .pkt-path {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.2rem;
      margin-top: 0.25rem;
    }
    .path-chip {
      font-family: monospace;
      font-size: 0.68rem;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.05rem 0.4rem;
      border-radius: 4px;
      cursor: default;
      position: relative;
    }
    .path-chip-named {
      border-color: #38bdf8;
      color: #7dd3fc;
    }
    /* Tooltip showing name on hover */
    .path-chip[title]:hover::after {
      content: attr(title);
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 0.7rem;
      font-family: inherit;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    .path-arrow {
      font-size: 0.68rem;
      color: #475569;
    }

    .empty-state {
      text-align: center;
      color: #475569;
      padding: 3rem 1rem;
      font-size: 0.9rem;
    }

    /* Raw / Table toggle buttons */
    .raw-toggle-btn {
      background: none;
      border: 1px solid #334155;
      color: #64748b;
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .raw-toggle-btn.active { color: #fbbf24; border-color: #fbbf24; background: rgba(251,191,36,0.08); }
    .raw-toggle-btn:hover:not(.active) { color: #cbd5e1; border-color: #475569; }

    /* Compact table view */
    .pkt-table-header {
      display: grid;
      grid-template-columns: 56px 72px 1fr 1fr 80px;
      gap: 0.5rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.67rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #475569;
      border-bottom: 1px solid #1e293b;
    }
    .pkt-table-row {
      display: grid;
      grid-template-columns: 56px 72px 1fr 1fr 80px;
      gap: 0.5rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.78rem;
      border-bottom: 1px solid #111827;
      background: #0a0f1a;
      align-items: center;
      transition: background 0.15s;
    }
    .pkt-table-row:hover { background: #0f172a; }
    .pkt-table-row.new-flash { animation: row-flash 0.6s ease-out; }
    .pkt-table-time { color: #475569; font-family: monospace; font-size: 0.7rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .pkt-table-badge { }
    .pkt-table-path { font-family: monospace; font-size: 0.7rem; color: #64748b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pkt-table-path .path-named { color: #7dd3fc; }
    .pkt-table-node { color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.78rem; }
    .pkt-table-sig { color: #64748b; font-size: 0.68rem; text-align: right; white-space: nowrap; font-family: monospace; }

    /* ---- Hex byte blocks ---- */
    .pkt-hex-seg {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: flex-end;
      margin-top: 0.4rem;
    }
    /* Each field = coloured block with bytes on top, label below */
    .hex-field {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: help;
    }
    .hex-field-bytes {
      font-family: monospace;
      font-size: 0.7rem;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .hex-field-label {
      font-size: 0.55rem;
      letter-spacing: 0.03em;
      white-space: nowrap;
      text-transform: uppercase;
      opacity: 0.7;
    }
    /* Field colour themes */
    .hf-header  .hex-field-bytes { background: rgba(251,191,36,0.22); color: #fbbf24; border: 1px solid rgba(251,191,36,0.45); }
    .hf-header  .hex-field-label { color: #fbbf24; }
    .hf-pathlen .hex-field-bytes { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
    .hf-pathlen .hex-field-label { color: #94a3b8; }
    .hf-hop     .hex-field-bytes { background: rgba(148,163,184,0.12); color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); }
    .hf-hop     .hex-field-label { color: #94a3b8; }
    .hf-hop-named .hex-field-bytes { background: rgba(125,211,252,0.18); color: #7dd3fc; border: 1px solid rgba(125,211,252,0.4); }
    .hf-hop-named .hex-field-label { color: #7dd3fc; }
    .hex-hop-group {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: help;
    }
    .hex-hop-bytes-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
    }
    .hex-hop-bytes-row .hex-field-bytes {
      font-family: monospace;
      font-size: 0.7rem;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .hex-hop-bytes-row .hf-hop { background: rgba(148,163,184,0.12); color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); }
    .hex-hop-bytes-row .hf-hop-named { background: rgba(125,211,252,0.18); color: #7dd3fc; border: 1px solid rgba(125,211,252,0.4); }
    .hf-key     .hex-field-bytes { background: rgba(249,115,22,0.18); color: #fb923c; border: 1px solid rgba(249,115,22,0.4); }
    .hf-key     .hex-field-label { color: #fb923c; }
    .hf-ts      .hex-field-bytes { background: rgba(167,139,250,0.18); color: #a78bfa; border: 1px solid rgba(167,139,250,0.35); }
    .hf-ts      .hex-field-label { color: #a78bfa; }
    .hf-sig     .hex-field-bytes { background: rgba(71,85,105,0.25); color: #475569; border: 1px solid rgba(71,85,105,0.4); }
    .hf-sig     .hex-field-label { color: #64748b; }
    .hf-coord   .hex-field-bytes { background: rgba(74,222,128,0.14); color: #4ade80; border: 1px solid rgba(74,222,128,0.35); }
    .hf-coord   .hex-field-label { color: #4ade80; }
    .hf-name    .hex-field-bytes { background: rgba(34,197,94,0.18); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); cursor: pointer; }
    .hf-name    .hex-field-label { color: #22c55e; }
    .hf-name:hover .hex-field-bytes { background: rgba(34,197,94,0.3); }
    .hf-payload .hex-field-bytes { background: rgba(71,85,105,0.12); color: #64748b; border: 1px solid rgba(71,85,105,0.2); }
    .hf-payload .hex-field-label { color: #64748b; }
    .hex-decoded-label {
      display: inline-block;
      color: #22c55e; font-style: italic;
      background: rgba(34,197,94,0.12);
      border-radius: 3px; padding: 2px 6px;
      font-size: 0.7rem; font-family: inherit;
      align-self: center;
    }

    /* Decoded advert info block */
    .advert-decoded {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.1rem 0.6rem;
      font-size: 0.7rem;
      margin-top: 0.35rem;
      padding: 0.35rem 0.6rem;
      background: rgba(249,115,22,0.05);
      border-left: 2px solid rgba(249,115,22,0.3);
      border-radius: 0 4px 4px 0;
    }
    .advert-decoded-key { color: #64748b; white-space: nowrap; }
    .advert-decoded-val { color: #cbd5e1; font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Recent Packets</h1>
      <div class="subtitle" id="packetCount"></div>
      <div class="header-meta">
        <div class="header-conn-mini"><span class="status-dot unknown" id="miniConnDot"></span><span id="miniConnText">—</span></div>
      </div>
    </div>
    <nav class="nav-group">
      <a href="/" class="nav-btn" title="Dashboard">Dashboard</a>
      <a href="/map" class="nav-btn" title="Network Map">Map</a>
      <a href="/messages" class="nav-btn" title="Messages">Messages</a>
      <a href="/packets" class="nav-btn nav-btn-active" title="Recent Packets">Packets</a>
      <a href="/contacts" class="nav-btn" title="Contacts">Contacts</a>
      <a href="/logs" class="nav-btn" title="Activity Logs">Logs</a>
      <a href="/settings" class="nav-btn nav-settings" title="Settings">&#9881;</a>
    </nav>
  </header>

  <div class="packets-body">
    <div class="packets-toolbar">
      <div class="filter-menu-wrap" id="filterMenuWrap">
        <button class="filter-menu-btn" id="filterMenuBtn" onclick="toggleFilterMenu()">
          &#9776; <span id="filterLabel">All</span> <span class="fmb-arr">&#9660;</span>
        </button>
        <div class="filter-menu-dropdown" id="filterMenuDropdown">
          <button class="fmd-item active" data-type="all" onclick="setFilter('all')">All</button>
          <button class="fmd-item" data-type="contact_msg" onclick="setFilter('contact_msg')">Direct Msgs</button>
          <button class="fmd-item" data-type="channel_msg" onclick="setFilter('channel_msg')">Channel Msgs</button>
          <button class="fmd-item" data-type="ack" onclick="setFilter('ack')">ACKs</button>
          <button class="fmd-item" data-type="path" onclick="setFilter('path')">Path Updates</button>
          <button class="fmd-item" data-type="rx" onclick="setFilter('rx')">RF Packets</button>
          <button class="fmd-item" data-type="request_rx" onclick="setFilter('request_rx')">Requests</button>
          <button class="fmd-item" data-type="textmsg_rx" onclick="setFilter('textmsg_rx')">Text Msgs</button>
          <button class="fmd-item" data-type="advert" onclick="setFilter('advert')">Adverts</button>
          <button class="fmd-item" data-type="direct_rx" onclick="setFilter('direct_rx')">Direct</button>
        </div>
      </div>
      <select class="time-select" id="timeWindow" onchange="renderList()" title="Show events from last…">
        <option value="0">All time</option>
        <option value="15">Last 15 min</option>
        <option value="60">Last 1 hour</option>
        <option value="360">Last 6 hours</option>
      </select>
      <input class="pkt-search" id="pktSearch" type="search" placeholder="Search…" oninput="renderList()">
      <button class="raw-toggle-btn" id="tableToggleBtn" onclick="toggleTable()" title="Compact table view">TABLE</button>
      <button class="raw-toggle-btn" id="rawToggleBtn" onclick="toggleRaw()" title="Toggle raw hex view">RAW</button>
      <span class="live-badge" id="liveBadge">
        <span class="live-dot"></span> Live
      </span>
    </div>

    <div class="packets-list" id="packetsList">
      <div class="empty-state" id="emptyState">Waiting for mesh activity…</div>
    </div>
  </div>

  <script>
    var _filter = 'all';
    var _rawMode = false;
    var _tableMode = false;
    var _events = [];
    var _knownIds = new Set();
    var _paused = false;
    var _refreshInterval = null;
    var _nodeIdChars = 2;  // loaded from settings

    var _FILTER_LABELS = { all:'All', contact_msg:'Direct Msgs', channel_msg:'Channel Msgs', ack:'ACKs', path:'Path Updates', rx:'RF Packets', request_rx:'Requests', textmsg_rx:'Text Msgs', advert:'Adverts', direct_rx:'Direct' };

    function setFilter(type) {
      _filter = type;
      document.querySelectorAll('.fmd-item').forEach(function(b) { b.classList.remove('active'); });
      var active = document.querySelector('.fmd-item[data-type="' + type + '"]');
      if (active) active.classList.add('active');
      var lbl = document.getElementById('filterLabel');
      if (lbl) lbl.textContent = _FILTER_LABELS[type] || type;
      var btn = document.getElementById('filterMenuBtn');
      if (btn) btn.classList.toggle('has-filter', type !== 'all');
      closeFilterMenu();
      renderList();
    }

    function toggleFilterMenu() {
      document.getElementById('filterMenuDropdown').classList.toggle('open');
    }

    function closeFilterMenu() {
      var dd = document.getElementById('filterMenuDropdown');
      if (dd) dd.classList.remove('open');
    }

    // Close filter menu on outside click
    document.addEventListener('click', function(e) {
      var wrap = document.getElementById('filterMenuWrap');
      if (wrap && !wrap.contains(e.target)) closeFilterMenu();
    });

    function toggleTable() {
      _tableMode = !_tableMode;
      document.getElementById('tableToggleBtn').classList.toggle('active', _tableMode);
      if (_tableMode) {
        _rawMode = false;
        document.getElementById('rawToggleBtn').classList.remove('active');
      }
      renderList();
    }

    function toggleRaw() {
      _rawMode = !_rawMode;
      var btn = document.getElementById('rawToggleBtn');
      btn.classList.toggle('active', _rawMode);
      if (_rawMode) {
        _tableMode = false;
        document.getElementById('tableToggleBtn').classList.remove('active');
      }
      renderList();
    }

    function fmtTime(ts) {
      var d = new Date(ts * 1000);
      var h = String(d.getHours()).padStart(2, '0');
      var m = String(d.getMinutes()).padStart(2, '0');
      var s = String(d.getSeconds()).padStart(2, '0');
      return h + ':' + m + ':' + s;
    }

    function buildPathChips(chips, fallbackPath) {
      var pathDiv = document.createElement('div');
      pathDiv.className = 'pkt-path';
      var items = chips && chips.length ? chips : null;
      // Fallback: parse raw path string if no chips available
      if (!items && fallbackPath) {
        items = fallbackPath.split('>').map(function(s) {
          s = s.trim();
          return { id: s, name: s };
        });
      }
      if (!items || !items.length) return pathDiv;
      items.forEach(function(hop, i) {
        if (i > 0) {
          var arr = document.createElement('span');
          arr.className = 'path-arrow';
          arr.textContent = '\u2192';
          pathDiv.appendChild(arr);
        }
        var chip = document.createElement('span');
        var isNamed = hop.name && hop.name !== hop.id;
        chip.className = 'path-chip' + (isNamed ? ' path-chip-named' : '');
        chip.textContent = hop.id.substring(0, _nodeIdChars);
        if (isNamed) chip.title = hop.name;
        pathDiv.appendChild(chip);
      });
      var tail = document.createElement('span');
      tail.className = 'path-arrow';
      tail.textContent = '\u2192 [You]';
      pathDiv.appendChild(tail);
      return pathDiv;
    }

    function buildHexSegments(evt) {
      var raw = evt.raw || '';
      var container = document.createElement('div');
      container.className = 'pkt-hex-seg';

      function addField(hexStr, theme, label, tip, clickLabel) {
        if (!hexStr) return;
        var wrap = document.createElement('div');
        wrap.className = 'hex-field ' + theme;
        if (tip) wrap.title = tip;

        var bytes = document.createElement('span');
        bytes.className = 'hex-field-bytes';
        // Long fields: truncate display but keep full in title
        var displayHex = hexStr.length > 16 ? hexStr.slice(0, 16) + '\u2026' : hexStr;
        bytes.textContent = displayHex;
        wrap.appendChild(bytes);

        var lbl = document.createElement('span');
        lbl.className = 'hex-field-label';
        lbl.textContent = label;
        wrap.appendChild(lbl);

        if (clickLabel) {
          bytes.style.cursor = 'pointer';
          bytes.title = 'Tap to reveal';
          bytes.addEventListener('click', function() {
            var existing = container.querySelector('.hex-decoded-label');
            if (existing && existing.dataset.for === label) { existing.remove(); return; }
            if (existing) existing.remove();
            var decoded = document.createElement('span');
            decoded.className = 'hex-decoded-label';
            decoded.dataset.for = label;
            decoded.textContent = clickLabel;
            container.appendChild(decoded);
          });
        }
        container.appendChild(wrap);
      }

      if (raw.length < 4) {
        var fb = document.createElement('span');
        fb.style.color = '#64748b'; fb.style.fontFamily = 'monospace'; fb.style.fontSize = '0.7rem';
        fb.textContent = raw;
        container.appendChild(fb);
        return container;
      }

      var header = parseInt(raw.slice(0, 2), 16);
      var routeType = header & 0x03;
      var payloadType = (header >> 2) & 0x0F;
      var routeNames = ['Direct', 'Flood', 'Routed', 'Reply'];
      addField(raw.slice(0, 2), 'hf-header', 'Header',
        routeNames[routeType] + ' route \u2022 payload type ' + payloadType);

      var pathLen = 0, hopHexSize = 2;
      if (routeType !== 0) {
        var pathLenByte = parseInt(raw.slice(2, 4), 16);
        var hashSizeBits = (pathLenByte >> 6) & 0x03;
        hopHexSize = (hashSizeBits + 1) * 2;  // 0→2, 1→4, 2→6 hex chars
        pathLen = pathLenByte & 0x3F;
        var hopBytes = ['1-byte','2-byte','3-byte'][hashSizeBits] || (hashSizeBits+1)+'-byte';
        addField(raw.slice(2, 4), 'hf-pathlen', 'Path len',
          pathLen + ' hop' + (pathLen !== 1 ? 's' : '') + ' (' + hopBytes + ')');

        var pathArr = evt.path || [];
        if (pathLen > 0) {
          var hopGroup = document.createElement('div');
          hopGroup.className = 'hex-hop-group';
          var hopBytesRow = document.createElement('div');
          hopBytesRow.className = 'hex-hop-bytes-row';
          for (var i = 0; i < pathLen; i++) {
            var hp = 4 + i * hopHexSize;
            if (hp + hopHexSize > raw.length) break;
            var hopHex = raw.slice(hp, hp + hopHexSize);
            var hopInfo = pathArr[i];
            var hopName = hopInfo && hopInfo.name !== hopInfo.id ? hopInfo.name : '';
            var bytes = document.createElement('span');
            bytes.className = 'hex-field-bytes ' + (hopName ? 'hf-hop-named' : 'hf-hop');
            bytes.title = hopName ? hopName : '';
            bytes.textContent = hopHex;
            hopBytesRow.appendChild(bytes);
          }
          hopGroup.appendChild(hopBytesRow);
          var grpLbl = document.createElement('span');
          grpLbl.className = 'hex-field-label';
          grpLbl.textContent = 'Hops';
          hopGroup.appendChild(grpLbl);
          container.appendChild(hopGroup);
        }
      }

      var plStart = routeType === 0 ? 2 : 4 + pathLen * hopHexSize;
      var pl = raw.slice(plStart);

      if (payloadType === 4 && pl.length >= 218) {
        // Advert: pubkey(64) ts(8) sig(128) flags(2) lat(8) lon(8) name(rest)
        addField(pl.slice(0, 64),   'hf-key',   'Pub key',  'Public key (32 bytes)');
        addField(pl.slice(64, 72),  'hf-ts',    'Timestamp','Timestamp (4 bytes)');
        addField(pl.slice(72, 200), 'hf-sig',   'Signature','Signature (64 bytes)');
        addField(pl.slice(200, 202),'hf-payload','Flags',    'Flags (1 byte)');
        addField(pl.slice(202, 210),'hf-coord',  'Lat',      'Latitude');
        addField(pl.slice(210, 218),'hf-coord',  'Lon',      'Longitude');
        var nameHex = pl.slice(218);
        if (nameHex) {
          var nodeName = evt.node || '?';
          addField(nameHex, 'hf-name', 'Name',
            'Node name \u2022 tap bytes to reveal', nodeName);
        }
      } else if (pl) {
        addField(pl, 'hf-payload', 'Payload',
          'Payload (' + Math.floor(pl.length / 2) + ' bytes)');
      }

      return container;
    }

    var _RX_BADGE = {
      'Request':      { cls: 'badge-rx-request',    label: 'Request' },
      'Advert':       { cls: 'badge-rx-advert',     label: 'Advert' },
      'Group Text':   { cls: 'badge-rx-grouptext',  label: 'Group Text' },
      'Response':     { cls: 'badge-rx-response',   label: 'Response' },
      'Path Update':  { cls: 'badge-rx-path',       label: 'Path' },
      'Anon Request': { cls: 'badge-rx-anon',       label: 'Anon' },
      'Text Msg':     { cls: 'badge-rx-textmsg',    label: 'Text Msg' },
    };

    function badgeLabel(type) {
      switch (type) {
        case 'contact_msg': return 'Direct';
        case 'channel_msg': return 'Channel';
        case 'ack':         return 'ACK';
        case 'path':        return 'Path';
        case 'rx':          return 'RF';
        case 'advert_sent': return 'Advert \u2191';
        default:            return type;
      }
    }

    function matchesFilter(evt) {
      // Time window filter
      var windowSel = document.getElementById('timeWindow');
      var windowMins = windowSel ? parseInt(windowSel.value) : 0;
      if (windowMins > 0) {
        var cutoff = Date.now() / 1000 - windowMins * 60;
        if (evt.ts < cutoff) return false;
      }

      // Type filter
      var typeOk = false;
      if (_filter === 'all') {
        typeOk = true;
      } else if (_filter === 'advert') {
        typeOk = (evt.type === 'rx' && evt.pkt_type === 'Advert') || evt.type === 'advert_sent';
      } else if (_filter === 'request_rx') {
        typeOk = evt.type === 'rx' && evt.pkt_type === 'Request';
      } else if (_filter === 'textmsg_rx') {
        typeOk = evt.type === 'rx' && evt.pkt_type === 'Text Msg';
      } else if (_filter === 'direct_rx') {
        typeOk = evt.type === 'rx' && evt.direct === true;
      } else {
        typeOk = evt.type === _filter;
      }
      if (!typeOk) return false;

      // Text search
      var searchEl = document.getElementById('pktSearch');
      var term = searchEl ? searchEl.value.trim().toLowerCase() : '';
      if (term) {
        var haystack = [
          evt.type, evt.pkt_type, evt.sender, evt.text,
          evt.channel, evt.name, evt.node, evt.route, evt.raw
        ].filter(Boolean).join(' ').toLowerCase();
        if (haystack.indexOf(term) === -1) return false;
      }

      return true;
    }

    function buildRow(evt, isNew) {
      var row = document.createElement('div');
      row.className = 'packet-row' + (isNew ? ' new-flash' : '');

      // Top row: badge left, time right
      var top = document.createElement('div');
      top.className = 'pkt-top';

      var badge = document.createElement('span');
      if (evt.type === 'rx' && evt.pkt_type && _RX_BADGE[evt.pkt_type]) {
        var rxb = _RX_BADGE[evt.pkt_type];
        badge.className = 'pkt-badge ' + rxb.cls;
        badge.textContent = rxb.label;
      } else {
        badge.className = 'pkt-badge badge-' + evt.type;
        badge.textContent = badgeLabel(evt.type);
      }
      top.appendChild(badge);

      var time = document.createElement('div');
      time.className = 'pkt-time';
      time.textContent = fmtTime(evt.ts);
      top.appendChild(time);

      row.appendChild(top);

      var body = document.createElement('div');
      body.className = 'pkt-body';

      if (evt.type === 'contact_msg') {
        var sender = document.createElement('div');
        sender.className = 'pkt-text';
        sender.textContent = '\u2192 ' + (evt.sender || 'Unknown');
        body.appendChild(sender);
        if (evt.text) {
          var txt = document.createElement('div');
          txt.style.color = '#94a3b8';
          txt.textContent = evt.text;
          body.appendChild(txt);
        }
        var meta = document.createElement('div');
        meta.className = 'pkt-meta';
        var hopStr = evt.hops >= 0 ? evt.hops + ' hop' + (evt.hops !== 1 ? 's' : '') : '? hops';
        meta.textContent = hopStr;
        body.appendChild(meta);

      } else if (evt.type === 'channel_msg') {
        var sender = document.createElement('div');
        sender.className = 'pkt-text';
        sender.textContent = (evt.channel || 'Ch?') + '  \u2022  ' + (evt.sender || 'Unknown');
        body.appendChild(sender);
        if (evt.text) {
          var txt = document.createElement('div');
          txt.style.color = '#94a3b8';
          txt.textContent = evt.text;
          body.appendChild(txt);
        }
        var meta = document.createElement('div');
        meta.className = 'pkt-meta';
        var hopStr = evt.hops >= 0 ? evt.hops + ' hop' + (evt.hops !== 1 ? 's' : '') : '? hops';
        meta.textContent = hopStr;
        body.appendChild(meta);

      } else if (evt.type === 'ack') {
        var main = document.createElement('div');
        main.className = 'pkt-text';
        main.textContent = 'Message confirmed seen by ' + (evt.seen_by || 1) + ' node' + (evt.seen_by !== 1 ? 's' : '');
        body.appendChild(main);
        if (evt.ack_code) {
          var meta = document.createElement('div');
          meta.className = 'pkt-meta';
          meta.textContent = 'code: ' + evt.ack_code;
          body.appendChild(meta);
        }

      } else if (evt.type === 'path') {
        var main = document.createElement('div');
        main.className = 'pkt-text';
        main.textContent = (evt.name || evt.pubkey || '?') + '  \u2014  ' + (evt.hops >= 0 ? evt.hops + ' hop' + (evt.hops !== 1 ? 's' : '') : '? hops');
        body.appendChild(main);
        if (evt.route) {
          var meta = document.createElement('div');
          meta.className = 'pkt-meta';
          meta.textContent = evt.route;
          body.appendChild(meta);
        }

      } else if (evt.type === 'rx') {
        var main = document.createElement('div');
        main.className = 'pkt-text';
        var typeLabel = (evt.pkt_type !== undefined && evt.pkt_type !== '') ? evt.pkt_type : 'RF Packet';
        var mainText = typeLabel;
        if (evt.node) mainText += '  \u2022  ' + evt.node;
        main.textContent = mainText;
        body.appendChild(main);

        if (evt.path && evt.path.length > 0) {
          var pathDiv = document.createElement('div');
          pathDiv.className = 'pkt-path';
          evt.path.forEach(function(hop, i) {
            if (i > 0) {
              var arr = document.createElement('span');
              arr.className = 'path-arrow';
              arr.textContent = '\u2192';
              pathDiv.appendChild(arr);
            }
            var chip = document.createElement('span');
            var isNamed = hop.name && hop.name !== hop.id;
            // Always show hex ID on chip; put name in tooltip if known
            chip.className = 'path-chip' + (isNamed ? ' path-chip-named' : '');
            chip.textContent = hop.id;
            if (isNamed) chip.title = hop.name;
            pathDiv.appendChild(chip);
          });
          var tail = document.createElement('span');
          tail.className = 'path-arrow';
          tail.textContent = '\u2192 [You]';
          pathDiv.appendChild(tail);
          body.appendChild(pathDiv);
        }

        var meta = document.createElement('div');
        meta.className = 'pkt-meta';
        var parts = [];
        if (evt.snr != null) parts.push('SNR ' + evt.snr + ' dB');
        if (evt.rssi != null) parts.push('RSSI ' + evt.rssi + ' dBm');
        meta.textContent = parts.join('  \u2022  ');
        body.appendChild(meta);

        // Decoded advert info block
        if (evt.pkt_type === 'Advert' && evt.advert) {
          var ad = evt.advert;
          var adDiv = document.createElement('div');
          adDiv.className = 'advert-decoded';
          function adRow(k, v) {
            if (v == null || v === '' || v === '?') return;
            var kEl = document.createElement('span'); kEl.className = 'advert-decoded-key'; kEl.textContent = k;
            var vEl = document.createElement('span'); vEl.className = 'advert-decoded-val'; vEl.textContent = v;
            adDiv.appendChild(kEl); adDiv.appendChild(vEl);
          }
          if (ad.name) adRow('Name', ad.name);
          if (ad.pubkey) adRow('Pubkey', ad.pubkey.slice(0, 16) + '\u2026');
          if (ad.ts) {
            var d = new Date(ad.ts * 1000);
            adRow('Timestamp', d.toLocaleString());
          }
          if (ad.lat != null && ad.lon != null && (ad.lat !== 0 || ad.lon !== 0)) {
            adRow('Latitude', ad.lat.toFixed(6) + '\u00b0');
            adRow('Longitude', ad.lon.toFixed(6) + '\u00b0');
          }
          if (adDiv.children.length > 0) body.appendChild(adDiv);
        }

        if (evt.raw) {
          if (_rawMode) {
            var rawDiv = document.createElement('div');
            rawDiv.className = 'pkt-hex-seg';
            rawDiv.style.color = '#64748b';
            rawDiv.textContent = evt.raw;
            body.appendChild(rawDiv);
          } else {
            body.appendChild(buildHexSegments(evt));
          }
        }

      } else if (evt.type === 'advert_sent') {
        var main = document.createElement('div');
        main.className = 'pkt-text';
        main.textContent = 'Sent floodadv \u2192 ' + (evt.name || evt.pubkey || '?');
        body.appendChild(main);
        var meta = document.createElement('div');
        meta.className = 'pkt-meta';
        meta.textContent = 'Repeater commanded to broadcast flood advertisement';
        body.appendChild(meta);
      }

      row.appendChild(body);
      return row;
    }

    function buildTableRow(evt, isNew) {
      var row = document.createElement('div');
      row.className = 'pkt-table-row' + (isNew ? ' new-flash' : '');

      // Time
      var time = document.createElement('span');
      time.className = 'pkt-table-time';
      time.textContent = fmtTime(evt.ts);
      row.appendChild(time);

      // Type badge (reuse existing badge logic)
      var badge = document.createElement('span');
      if (evt.type === 'rx' && evt.pkt_type && _RX_BADGE[evt.pkt_type]) {
        var rxb = _RX_BADGE[evt.pkt_type];
        badge.className = 'pkt-badge ' + rxb.cls;
        badge.textContent = rxb.label;
      } else {
        badge.className = 'pkt-badge badge-' + evt.type;
        badge.textContent = badgeLabel(evt.type);
      }
      var badgeWrap = document.createElement('span');
      badgeWrap.className = 'pkt-table-badge';
      badgeWrap.appendChild(badge);
      row.appendChild(badgeWrap);

      // Path \u2014 compact A68C\u21920C37\u2192[You] or route string
      var pathEl = document.createElement('span');
      pathEl.className = 'pkt-table-path';
      if (evt.path && evt.path.length) {
        evt.path.forEach(function(hop, i) {
          if (i > 0) { pathEl.appendChild(document.createTextNode('\u2192')); }
          var seg = document.createElement('span');
          var isNamed = hop.name && hop.name !== hop.id;
          if (isNamed) { seg.className = 'path-named'; seg.title = hop.name; }
          seg.textContent = hop.id.substring(0, _nodeIdChars);
          pathEl.appendChild(seg);
        });
        pathEl.appendChild(document.createTextNode('\u2192[You]'));
      } else if (evt.route) {
        pathEl.textContent = evt.route;
      } else if (evt.type === 'rx') {
        pathEl.textContent = 'direct';
      }
      row.appendChild(pathEl);

      // Node / details
      var nodeEl = document.createElement('span');
      nodeEl.className = 'pkt-table-node';
      var detail = evt.node || evt.name || evt.sender || evt.channel || '';
      if (evt.type === 'contact_msg' && evt.sender) detail = '\u2192 ' + evt.sender;
      if (evt.type === 'channel_msg') detail = (evt.channel || 'Ch?') + '  ' + (evt.sender || '');
      if (evt.type === 'path') detail = evt.name || evt.pubkey || '?';
      if (evt.type === 'ack') detail = 'ACK \u00d7' + (evt.seen_by || 1);
      if (evt.text) detail += (detail ? '  ' : '') + evt.text;
      nodeEl.textContent = detail;
      row.appendChild(nodeEl);

      // Signal
      var sigEl = document.createElement('span');
      sigEl.className = 'pkt-table-sig';
      var parts = [];
      if (evt.rssi != null) parts.push(evt.rssi + 'dBm');
      if (evt.snr != null) parts.push(evt.snr + 'dB');
      if (evt.hops != null && evt.hops >= 0) parts.push(evt.hops + 'h');
      sigEl.textContent = parts.join(' ');
      row.appendChild(sigEl);

      return row;
    }

    function renderList() {
      var list = document.getElementById('packetsList');
      var filtered = _events.filter(matchesFilter);
      document.getElementById('packetCount').textContent = filtered.length + ' event' + (filtered.length !== 1 ? 's' : '');
      list.innerHTML = '';
      if (filtered.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'empty-state';
        var label = _filter === 'advert' ? 'Advert' : badgeLabel(_filter);
        empty.textContent = _filter === 'all' ? 'Waiting for mesh activity\u2026' : 'No ' + label + ' events yet';
        list.appendChild(empty);
        return;
      }
      if (_tableMode) {
        var header = document.createElement('div');
        header.className = 'pkt-table-header';
        ['Time','Type','Path','Details','Signal'].forEach(function(col) {
          var c = document.createElement('span'); c.textContent = col; header.appendChild(c);
        });
        list.appendChild(header);
        filtered.forEach(function(evt) { list.appendChild(buildTableRow(evt, false)); });
      } else {
        filtered.forEach(function(evt) { list.appendChild(buildRow(evt, false)); });
      }
    }

    function mergeEvents(newEvents) {
      var added = 0;
      // Events come newest-first from API; process in reverse to add oldest first
      var reversed = newEvents.slice().reverse();
      reversed.forEach(function(evt) {
        var id = evt.ts + '_' + evt.type + '_' + (evt.text || evt.ack_code || evt.route || '');
        if (!_knownIds.has(id)) {
          _knownIds.add(id);
          _events.unshift(evt);
          added++;
        }
      });
      // Keep max 200 locally
      if (_events.length > 200) { _events = _events.slice(0, 200); }
      return added;
    }

    async function fetchPackets() {
      try {
        var resp = await fetch('/api/packets?limit=200');
        if (!resp.ok) return;
        var data = await resp.json();
        var added = mergeEvents(data);
        if (added > 0) renderList();
      } catch (e) { /* network error — ignore */ }
    }

    fetch('/api/settings').then(function(r) { return r.json(); }).then(function(s) {
      if (s.node_id_chars) _nodeIdChars = s.node_id_chars;
    }).catch(function() {});

    fetchPackets();
    _refreshInterval = setInterval(fetchPackets, 3000);
  </script>

  _mc();setInterval(_mc,10000);})();
